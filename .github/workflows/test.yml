name: Host tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Build & run host tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake

      - name: Configure
        working-directory: test
        run: cmake -S . -B build

      - name: Build
        working-directory: test
        run: cmake --build build

      - name: Run tests
        working-directory: test
        run: ./build/run_tests